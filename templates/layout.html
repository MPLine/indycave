{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IndyCave — Scout</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>

        :root {
            --indy-black: #1c1c1c;
            --indy-dark: #111111;
            --indy-green: #00d623;
            --indy-light: #f5f7f6;
            --indy-border: #e3e7e4;
            --indy-muted: #737a76;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--indy-light);
            color: var(--indy-black);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar-custom {
            height: 72px;
            background: white;
            border-bottom: 1px solid var(--indy-border);
        }

        .navbar-inner {
            max-width: 1180px;
            height: 100%;
            margin: auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: var(--indy-black);
        }


        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand-tag {
            color: var(--indy-muted);
            font-size: 13px;
            margin-left: 4px;
        }

        .scout-badge {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 12px;
            border-radius: 30px;

            background: #f0fff2;
            color: #087719;

            font-size: 13px;
            font-weight: 600;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--indy-green);
        }


        /* =========================
           MAIN
        ========================= */

        .main-wrapper {
            max-width: 900px;
            margin: auto;
            padding: 55px 20px 80px;
        }


        /* =========================
           INTRO
        ========================= */

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .intro h1 {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 750;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .intro p {
            color: var(--indy-muted);
            font-size: 16px;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }


        /* =========================
           PROGRESS
        ========================= */

        .progress-area {
            max-width: 650px;
            margin: 0 auto 25px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 8px;

            font-size: 13px;
            color: var(--indy-muted);
        }

        .progress {
            height: 6px;
            background: #e2e6e3;
            border-radius: 20px;
        }

        .progress-bar {
            background: var(--indy-green);
            border-radius: 20px;
        }


        /* =========================
           QUESTION CARD
        ========================= */

        .question-card {
            background: white;

            border: 1px solid var(--indy-border);
            border-radius: 22px;

            padding: 35px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.05);
        }

        .question-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            color: #087719;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 12px;
        }

        .question-label span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--indy-green);
        }

        .question-title {
            font-size: clamp(23px, 4vw, 30px);
            font-weight: 700;
            letter-spacing: -0.7px;

            margin-bottom: 8px;
        }

        .question-description {
            color: var(--indy-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }


        /* =========================
           OPTIONS
        ========================= */

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option {
            position: relative;
            cursor: pointer;
        }

        .option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .option-content {
            min-height: 62px;

            display: flex;
            align-items: center;

            padding: 16px 18px;

            background: white;

            border: 1.5px solid var(--indy-border);
            border-radius: 14px;

            transition:
                border-color 0.18s ease,
                background 0.18s ease,
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .option-content:hover {
            border-color: #9ba49f;
            transform: translateY(-1px);
        }

        .option-indicator {
            width: 20px;
            height: 20px;

            margin-right: 13px;

            border: 1.5px solid #b8c0bb;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;
        }

        .single .option-indicator {
            border-radius: 50%;
        }

        .multiple .option-indicator {
            border-radius: 6px;
        }

        .option-text {
            font-size: 15px;
            font-weight: 600;
        }


        /* Selected */

        .option input:checked + .option-content {
            border-color: var(--indy-green);
            background: #f1fff3;

            box-shadow:
                0 0 0 3px rgba(0, 214, 35, 0.08);
        }

        .option input:checked + .option-content
        .option-indicator {
            border-color: var(--indy-green);
            background: var(--indy-green);
        }

        .option input:checked + .option-content
        .option-indicator::after {
            content: "✓";
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
        }


        /* =========================
           FOOTER / BUTTON
        ========================= */

        .question-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 30px;
            padding-top: 25px;

            border-top: 1px solid var(--indy-border);
        }

        .helper-text {
            color: var(--indy-muted);
            font-size: 13px;
        }

        .continue-btn {
            border: none;

            background: var(--indy-black);
            color: white;

            padding: 13px 26px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: 700;

            transition:
                background 0.18s ease,
                transform 0.18s ease;
        }

        .continue-btn:hover {
            background: var(--indy-green);
            color: var(--indy-black);
            transform: translateY(-1px);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .navbar-custom {
                height: 64px;
            }

            .navbar-inner {
                padding: 0 16px;
            }

            .brand-logo {
                width: 36px;
                height: 36px;
            }

            .brand-name {
                font-size: 18px;
            }

            .brand-tag {
                display: none;
            }

            .scout-badge {
                padding: 6px 9px;
            }

            .main-wrapper {
                padding: 35px 15px 60px;
            }

            .intro {
                margin-bottom: 28px;
            }

            .intro h1 {
                letter-spacing: -1px;
            }

            .question-card {
                padding: 23px 18px;
                border-radius: 18px;
            }

            .options {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .question-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .helper-text {
                text-align: center;
            }

            .continue-btn {
                width: 100%;
            }
        }

        
    </style>

</head>
